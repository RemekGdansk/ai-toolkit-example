name: Publish AI Toolkit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Release guard
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            echo "::error::Release $TAG is marked as a pre-release. Pre-releases are not published; delete it and cut a normal release."
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$version' (expected tag 'v$version'). Bump package.json or fix the tag."
            exit 1
          fi
          echo "Release tag $TAG matches package.json version $version."

      - run: npm ci

      - run: npm test

      - name: Pack
        run: npm pack

      - name: Check tarball contents
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(remekgdansk-ai-toolkit-example-*.tgz)
          if [ ${#tarballs[@]} -ne 1 ]; then
            echo "::error::Expected exactly one remekgdansk-ai-toolkit-example-*.tgz, found ${#tarballs[@]}."
            exit 1
          fi
          tarball="${tarballs[0]}"
          contents=$(tar -tzf "$tarball")
          missing=0
          for entry in \
            package/dist/cli.js \
            package/dist/install.js \
            package/dist/uninstall.js \
            package/dist/fs-utils.js \
            package/dist/manifest.js \
            package/dist/payload.js \
            package/plugin/.claude-plugin/plugin.json \
            package/plugin/skills/repo-refresh/SKILL.md \
            package/plugin/skills/repo-refresh/scripts/repo-refresh.mjs; do
            if ! grep -qxF "$entry" <<< "$contents"; then
              echo "::error::$tarball is missing $entry"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "$tarball contains the CLI and the plugin files."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'release'
        with:
          name: package-tarball
          path: "*.tgz"
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    needs: check
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-tarball

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@remekgdansk'

      - name: Publish to GitHub Packages
        run: npm publish ./*.tgz --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
